<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Three.js Cheek Pinch</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
      }
      #ui {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 10;
        color: #fff;
        font: 14px/1.3 system-ui, sans-serif;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div>Foto di Sal - Clic & trascina per tirare la guancia</div>
    </div>
    <script type="module">
      import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

      // --- Scene base ---
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
      });
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      // Quad a schermo intero
      const geom = new THREE.PlaneGeometry(2, 2);

      // Uniforms stile Shadertoy
      const uniforms = {
        iResolution: { value: new THREE.Vector3() }, // (width, height, 1)
        iMouse: { value: new THREE.Vector4() }, // (x, y, down, 0)
        iChannel0: { value: null }, // texture della foto
      };

      // Vertex shader minimale
      const vert = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

      // Fragment shader (GLSL ES 1.00 – usa texture2D)
      const frag = `
      #ifdef GL_ES
      precision highp float;
      #endif

      #define RES iResolution

      uniform vec3  iResolution;
      uniform vec4  iMouse;
      uniform sampler2D iChannel0;

      // smooth min
      float smin(float d1, float d2, float k) {
        float h = max(k - abs(d1 - d2), 0.0) / k;
        return min(d1, d2) - h * h * k * 0.25;
      }

      vec2 mouse;         // XY mouse
      vec3 g;             // dominio distorto
      float d0 = 1.0;

      float map(vec3 p) {
        // Converte le coordinate del mouse da pixel a coordinate normalizzate
        mouse = (iMouse.xy - RES.xy * 0.5) / RES.y;

        // Applica una distorsione basata sulla posizione del mouse
        // Questa è la riga che crea l'effetto "pizzicotto"
        p.xy -= p.z * mouse.xy;

        g = p;

        float plane = p.z;

        p.z -= 1.0;
        // Il cono ora parte dalla posizione del mouse
        float cone = length(p.xy - mouse) + p.z / 10.0;

        p.z *= 3.0;
        float result = smin(plane, cone, 0.5);

        return result / sqrt(3.0);
      }

      float raymarch(inout vec3 p, vec3 rd) {
        float dd = 0.0;
        for (int i = 0; i < 100; i++) {
          float d = map(p);
          if (d < 1e-4 || dd > d0) break;
          p += rd * d;
          dd += d;
        }
        return dd;
      }

      vec3 render(vec3 p, vec3 rd) {
        float d = raymarch(p, rd);
        // evita schiacciamento per aspect ratio
        g /= RES.x / RES.y;

        // sample foto
        vec3 col = texture2D(iChannel0, g.xy + 0.5).rgb;
        return col;
      }

      void main() {
        vec2 fragCoord = gl_FragCoord.xy;
        vec2 uv = (fragCoord - iResolution.xy * 0.5) / iResolution.y;

        // camera ortografica
        vec3 ro = vec3(uv.x, uv.y, d0);
        vec3 rd = vec3(0.0, 0.0, -1.0);

        vec3 col = render(ro, rd);
        gl_FragColor = vec4(col, 1.0);
      }
    `;

      const mat = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: vert,
        fragmentShader: frag,
      });

      const mesh = new THREE.Mesh(geom, mat);
      scene.add(mesh);

      // Texture di default (griglia) finché non carichi una foto
      const defaultTex = new THREE.TextureLoader().load(
        "data:image/svg+xml,%3csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3e%3cdefs%3e%3cpattern id='a' patternUnits='userSpaceOnUse' width='20' height='20'%3e%3crect fill='%23f0f0f0' width='10' height='10'/%3e%3crect fill='%23e0e0e0' x='10' y='10' width='10' height='10'/%3e%3c/pattern%3e%3c/defs%3e%3crect fill='url(%23a)' width='100' height='100'/%3e%3c/svg%3e"
      );
      defaultTex.wrapS = defaultTex.wrapT = THREE.ClampToEdgeWrapping;
      defaultTex.minFilter = THREE.LinearFilter;
      defaultTex.magFilter = THREE.LinearFilter;
      uniforms.iChannel0.value = defaultTex;

      // Resize
      function onResize() {
        const w = window.innerWidth,
          h = window.innerHeight,
          dpr = Math.min(window.devicePixelRatio || 1, 2);
        renderer.setPixelRatio(dpr);
        renderer.setSize(w, h, false);
        uniforms.iResolution.value.set(w, h, 1);
      }
      window.addEventListener("resize", onResize);
      onResize();

      // Mouse: manteniamo l'ultimo punto cliccato/trascinato in pixel (come Shadertoy)
      let isDown = false;
      function setMouse(e) {
        const rect = renderer.domElement.getBoundingClientRect();
        const x = (e.clientX - rect.left) * renderer.getPixelRatio();
        const y = (rect.bottom - e.clientY) * renderer.getPixelRatio(); // inverti Y in stile Shadertoy
        uniforms.iMouse.value.set(x, y, isDown ? 1 : 0, 0);
      }
      renderer.domElement.addEventListener("mousedown", (e) => {
        isDown = true;
        setMouse(e);
      });
      window.addEventListener("mousemove", (e) => {
        if (isDown) setMouse(e);
      });
      window.addEventListener("mouseup", (e) => {
        isDown = false; /* mantieni xy al rilascio */
      });

      // Touch support
      renderer.domElement.addEventListener(
        "touchstart",
        (e) => {
          isDown = true;
          const t = e.touches[0];
          setMouse(t);
          e.preventDefault();
        },
        { passive: false }
      );
      renderer.domElement.addEventListener(
        "touchmove",
        (e) => {
          if (!isDown) return;
          const t = e.touches[0];
          setMouse(t);
          e.preventDefault();
        },
        { passive: false }
      );
      renderer.domElement.addEventListener("touchend", () => {
        isDown = false;
      });

      // Carica la foto di Sal hardcoded
      const salTexture = new THREE.TextureLoader().load(
        "./public/Sal.jpg",
        (tex) => {
          console.log("Foto di Sal caricata con successo!");
          tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          uniforms.iChannel0.value = tex;
        },
        (progress) => {
          console.log("Caricamento foto di Sal in corso...", progress);
        },
        (error) => {
          console.error("Errore nel caricamento della foto di Sal:", error);
          console.log("Mantengo la texture di default");
        }
      );

      // Loop
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    </script>
  </body>
</html>
